name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests and family guard cases
        run: npm test
      - name: Real Compose stack tests
        run: HARNESS_E2E=1 node --test tests/docker-e2e.test.mjs
      - name: Hook demo on a disposable project
        run: bash scripts/demo.sh
